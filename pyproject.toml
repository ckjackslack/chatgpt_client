[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-client"
version = "0.2.0"
description = "A small OpenAI Responses API CLI with searchable local history"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Maniak Root", email = "maniakroot@gmail.com" }]
dependencies = ["openai>=2.0.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "ruff>=0.12",
]

[project.scripts]
chatgpt-client = "chatgpt_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chatgpt_client"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chatgpt_client"]
